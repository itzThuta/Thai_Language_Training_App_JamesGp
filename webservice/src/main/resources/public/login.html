<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Thai Flashcards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 420px;
      width: 90%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }
    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    h4 {
      color: #2d3748;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .form-label {
      color: #4a5568;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .form-control {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5568d3 0%, #6a3f91 100%);
    }
    .btn-primary:disabled {
      transform: none;
      opacity: 0.7;
    }
    .alert {
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 20px;
    }
    .demo-info {
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #718096;
      text-align: center;
    }
    .demo-info strong {
      color: #2d3748;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="text-center">
      <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h4>Welcome Back</h4>
      <p class="subtitle">Sign in to continue learning Thai</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <button id="submitBtn" type="submit" class="btn btn-primary w-100">
        Login
      </button>
    </form>

    <div id="alertBox"></div>

    <div class="demo-info">
      <strong>Demo:</strong> alice / secret
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const btn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("alertBox");

    function showAlert(message, type = "danger") {
      alertBox.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.innerHTML = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        showAlert("Please enter both username and password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("username", data.username);
          localStorage.setItem("token", data.token);
          showAlert("Login successful! Redirecting...", "success");
          setTimeout(() => window.location.href = "welcome.html", 800);
        } else {
          showAlert(data.error || "Invalid credentials. Please try again.");
        }
      } catch (err) {
        showAlert("Network error. Please check your connection.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
